<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Vibrant fresh leaf & swoosh gradient matching Kareem's original logo -->
    <linearGradient id="kareemLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3C8B0E" />
      <stop offset="40%" stop-color="#5EAA14" />
      <stop offset="80%" stop-color="#7DC822" />
      <stop offset="100%" stop-color="#93D828" />
    </linearGradient>

    <linearGradient id="kareemSwooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F8D0F" />
      <stop offset="50%" stop-color="#69B81B" />
      <stop offset="100%" stop-color="#84CE23" />
    </linearGradient>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Fresh Leaf overlapping K and A -->
    <g transform="translate(70, 25)">
      <!-- Main Leaf Body -->
      <path
        d="M 12 120 C 15 75, 55 20, 130 0 C 125 50, 95 105, 35 125 C 22 129, 12 127, 12 120 Z"
        fill="url(#kareemLeafGrad)"
      />
      <!-- Inner vein highlight -->
      <path
        d="M 22 118 C 45 85, 75 48, 126 5"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        fill="none"
        opacity="0.85"
      />
      <!-- Branch veins -->
      <path
        d="M 52 88 C 68 82, 85 75, 96 68"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"
        fill="none"
        opacity="0.65"
      />
      <path
        d="M 72 65 C 88 60, 102 52, 112 44"
        stroke="#FFFFFF"
        stroke-width="1.8"
        stroke-linecap="round"
        fill="none"
        opacity="0.65"
      />
    </g>

    <!-- Main "KAREEM" Wordmark -->
    <!-- Italicized, bold geometric font -->
    <text
      x="10"
      y="172"
      fill="#073A12"
      font-family="'Montserrat', 'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="142"
      font-weight="900"
      letter-spacing="-0.02em"
      transform="skewX(-9)"
    >
      KAREEM
    </text>

    <!-- Registered Trademark symbol ® -->
    <g transform="translate(680, 56)">
      <circle cx="10" cy="10" r="9.5" fill="none" stroke="#073A12" stroke-width="2" />
      <text
        x="10"
        y="14"
        fill="#073A12"
        font-family="'Montserrat', -apple-system, sans-serif"
        font-size="11"
        font-weight="800"
        text-anchor="middle"
      >
        R
      </text>
    </g>

    <!-- Arched Green Underline Swoosh -->
    <path
      d="M 25 212 C 180 236, 420 188, 555 174 C 385 180, 205 214, 25 212 Z"
      fill="url(#kareemSwooshGrad)"
    />

    <!-- "SOFT DRINKS" Subtitle -->
    <text
      x="540"
      y="222"
      fill="#073A12"
      font-family="'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif"
      font-size="28"
      font-weight="800"
      letter-spacing="0.44em"
      text-anchor="end"
    >
      SOFT DRINKS
    </text>
  </g>
</svg>
